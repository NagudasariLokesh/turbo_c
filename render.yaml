# Render Blueprint -- deploy via the Render dashboard: New > Blueprint,
# point it at this repo. Render reads this file and creates both services.
#
# Uses Render's NATIVE runtimes (no Docker). The backend needs a C
# compiler; Render's native Python runtime ships gcc/g++ pre-installed
# (Debian 12 "bookworm") but has no way to install additional packages, so
# this only works with gcc, not clang (see backend/app/core/config.py).
# A Docker-based alternative still exists (sandbox/Dockerfile,
# frontend/Dockerfile, and the docker-compose.yml at the repo root) if you
# need clang specifically or want the sandbox isolation notes in
# sandbox/README.md -- switch each service's `runtime` back to `docker`
# and restore the `dockerfilePath`/`dockerContext` fields to use it.

services:
  - type: web
    name: turbo-c-ide-backend
    runtime: python
    # rootDir only scopes which file changes trigger a rebuild in a
    # monorepo -- it does NOT change the working directory buildCommand/
    # startCommand run from (confirmed against Render's docs after this
    # broke the first deploy: `pip install -r requirements.txt` ran from
    # the repo root and failed to find the file). Commands below `cd`
    # explicitly instead.
    rootDir: backend
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: https://turbo-c-ide-frontend.onrender.com
      # Without this, Render defaults to the newest Python (3.14 as of
      # writing) -- too new for pydantic-core's precompiled wheels in some
      # windows, which would force a from-source build needing a Rust
      # toolchain the native runtime doesn't have. Pinned to the version
      # this project is actually developed/tested against.
      - key: PYTHON_VERSION
        value: 3.12.3

  - type: web
    name: turbo-c-ide-frontend
    runtime: node
    rootDir: frontend
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://turbo-c-ide-backend.onrender.com
