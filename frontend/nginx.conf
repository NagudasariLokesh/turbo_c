# Server block only (this is COPY'd to /etc/nginx/conf.d/default.conf,
# which the base nginx:1.27-alpine image already wraps in its own http{}).
# Replaces the old separate "frontend" (Next.js/next start) + top-level
# "nginx" reverse-proxy containers: this one container now serves the
# static export AND proxies /api to the backend container, same as the
# single-service Render deployment's same-origin design (see ../README.md).

server {
    listen 80;
    server_name _;

    # The interactive run and debug endpoints are WebSocket upgrades, not
    # plain HTTP requests -- need the Upgrade/Connection headers and
    # HTTP/1.1, which a plain proxy_pass (see the /api/ block below)
    # doesn't send. Sessions can run for a while
    # (SESSION_MAX_DURATION_SECONDS in backend/app/core/config.py), hence
    # the long read timeout.
    location ~ ^/api/compiler/(run|debug)-ws$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 310s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Compilation requests can legitimately take several seconds (see
        # COMPILE_TIMEOUT_SECONDS in backend/app/core/config.py).
        proxy_read_timeout 30s;
    }

    location / {
        root /usr/share/nginx/html;
        # $uri/ (not just $uri/$uri.html) is required for "/" itself to
        # resolve to index.html -- Next's static-exports docs give this
        # exact try_files pattern for a plain static host.
        try_files $uri $uri.html $uri/ =404;
    }
}
