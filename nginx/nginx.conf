# Reverse proxy matching the spec's deployment architecture (section 10 /
# section 56 Phase 10): Internet -> Nginx -> Next.js (/) and Nginx -> FastAPI
# (/api). This file is a starting point -- it has no TLS/HTTPS block; add
# one (e.g. via certbot) before using it on a real domain. Not deployed or
# tested from this dev environment (no live server/domain available here).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 1m;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Compilation/execution requests can legitimately take several
            # seconds (see backend RUN_WALL_TIMEOUT_SECONDS/COMPILE_TIMEOUT_SECONDS).
            proxy_read_timeout 30s;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
