# Render Blueprint -- deploy via the Render dashboard: New > Blueprint,
# point it at this repo. Render reads this file and creates both services
# with the correct Dockerfile paths, which is the thing that failed when
# creating a Web Service manually (Render looks for a Dockerfile at the
# repo root by default; ours are in subdirectories).
#
# After the first deploy, open each service's Settings > Environment and
# double check the URLs below match the actual *.onrender.com hostnames
# Render assigned (they usually match the `name` fields exactly, but
# confirm rather than assume).

services:
  - type: web
    name: turbo-c-ide-backend
    runtime: docker
    dockerfilePath: ./sandbox/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: https://turbo-c-ide-frontend.onrender.com

  - type: web
    name: turbo-c-ide-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    # NEXT_PUBLIC_API_BASE_URL is NOT set here -- Render's Blueprint YAML
    # has no way to pass Docker build arguments, and NEXT_PUBLIC_* vars
    # must be present at build time, not just runtime, so a plain envVar
    # here would be silently ignored by the Next.js build. It's hardcoded
    # directly in frontend/Dockerfile instead. If you rename the backend
    # service, update it there (and this comment is your reminder why).
